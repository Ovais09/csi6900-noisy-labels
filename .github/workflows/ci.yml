name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run static analysis
        run: python -m ruff check src scripts tests main.py

      - name: Run tests with branch coverage
        run: python -m coverage run --branch --source=src,scripts -m pytest -q

      - name: Enforce core coverage floor
        run: python -m coverage report --include='src/*' --show-missing --fail-under=85

  container:
    name: Docker image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VCS_REF="${GITHUB_SHA}" -t csi6900-noisy-labels .

      - name: Run container test suite
        run: docker run --rm csi6900-noisy-labels

      - name: Run offline end-to-end experiment
        run: >-
          docker run --rm --network none csi6900-noisy-labels
          python scripts/run_full_pipeline.py
          --quick --skip-download

  report:
    name: LaTeX report
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out report source and compact assets
        uses: actions/checkout@v4

      - name: Build TeX image
        run: docker build -f report/Dockerfile -t csi6900-report .

      - name: Compile report offline
        run: docker run --rm --network none -v "$PWD:/work" csi6900-report

      - name: Reject unresolved references and layout warnings
        run: >-
          docker run --rm --network none -v "$PWD:/work" csi6900-report
          python -c "from pathlib import Path;
          log = Path('report/build/main.log').read_text();
          assert not any(word in log for word in ('Warning', 'Overfull', 'Underfull'));
          assert Path('report/build/main.pdf').stat().st_size > 10000"
